server.port=8081

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:change-this-local-development-secret-before-production}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=30
auth.email.enabled=${AUTH_EMAIL_ENABLED:false}
auth.email.from=${AUTH_EMAIL_FROM:noreply@taskcraft.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
