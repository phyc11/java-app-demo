server.port=8091

spring.application.name=billing-service

# Database Configuration
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Payment Gateway Configuration Mock Keys
payment.gateway.stripe.secret-key=sk_test_mock_stripe_key
payment.gateway.vnpay.tmn-code=VNPAY_MOCK_CODE
payment.gateway.momo.partner-code=MOMO_MOCK_PARTNER
