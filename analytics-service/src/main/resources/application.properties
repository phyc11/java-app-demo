server.port=8084
task-service.url=http://localhost:8082

spring.datasource.url=jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

analytics.snapshot.interval-ms=${ANALYTICS_SNAPSHOT_INTERVAL_MS:300000}
analytics.snapshot.initial-delay-ms=${ANALYTICS_SNAPSHOT_INITIAL_DELAY_MS:10000}
analytics.snapshot.page-size=${ANALYTICS_SNAPSHOT_PAGE_SIZE:200}
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m
