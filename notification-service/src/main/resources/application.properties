server.port=8085

spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Email is opt-in. Configure SMTP through environment variables before enabling it.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@taskcraft.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ is optional for local development.
notification.rabbitmq.enabled=${NOTIFICATION_RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:5}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2}
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL_MS:30000}

notification.email.max-attempts=${NOTIFICATION_EMAIL_MAX_ATTEMPTS:3}
notification.email.retry-interval-ms=${NOTIFICATION_EMAIL_RETRY_INTERVAL_MS:60000}
notification.digest.cron=${NOTIFICATION_DIGEST_CRON:0 0 * * * *}
notification.deadline.cron=${NOTIFICATION_DEADLINE_CRON:0 0 * * * *}
notification.deadline.page-size=${NOTIFICATION_DEADLINE_PAGE_SIZE:200}
task-service.url=${TASK_SERVICE_URL:http://localhost:8082}
notification.sse.heartbeat-interval-ms=${NOTIFICATION_SSE_HEARTBEAT_MS:25000}
notification.sse.max-connections-per-user=${NOTIFICATION_SSE_MAX_CONNECTIONS_PER_USER:5}
notification.dedup.retention-days=${NOTIFICATION_DEDUP_RETENTION_DAYS:30}
notification.dedup.cleanup-cron=${NOTIFICATION_DEDUP_CLEANUP_CRON:0 30 2 * * *}
