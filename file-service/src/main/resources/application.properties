server.port=8088

spring.application.name=file-service

# File Upload Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage configuration (LOCAL, S3, MINIO)
file.storage.type=LOCAL
file.storage.local-dir=./uploads
file.storage.presigned-url-expiration-minutes=30
file.storage.allowed-types=image/jpeg,image/png,image/gif,application/pdf,application/zip,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# Database Configuration
spring.datasource.url=jdbc:h2:mem:filedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
