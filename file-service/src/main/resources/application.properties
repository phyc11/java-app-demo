server.port=8088

spring.application.name=file-service

# File Upload Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# S3-compatible storage. Defaults target a local MinIO instance.
file.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
file.storage.region=${S3_REGION:us-east-1}
file.storage.access-key=${S3_ACCESS_KEY:minioadmin}
file.storage.secret-key=${S3_SECRET_KEY:minioadmin}
file.storage.bucket=${S3_BUCKET:taskcraft-files}
file.storage.presigned-url-expiration-minutes=${PRESIGNED_URL_MINUTES:15}
file.storage.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}
file.storage.allowed-types=image/jpeg,image/png,image/gif,application/pdf,application/zip,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# ClamAV fails closed when enabled and unavailable.
file.virus-scan.enabled=${VIRUS_SCAN_ENABLED:true}
file.virus-scan.host=${CLAMAV_HOST:localhost}
file.virus-scan.port=${CLAMAV_PORT:3310}
file.virus-scan.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}

services.task-url=${TASK_SERVICE_URL:http://localhost:8082}
file.cleanup.age-days=${FILE_CLEANUP_AGE_DAYS:1}
file.cleanup.cron=${FILE_CLEANUP_CRON:0 0 3 * * *}

# Database Configuration
spring.datasource.url=jdbc:h2:mem:filedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
